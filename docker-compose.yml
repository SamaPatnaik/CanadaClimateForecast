services: 
  postgres: 
    image: postgres:latest
    container_name: climate_db
    restart: unless-stopped
    environment: 
      POSTGRES_USER: climate
      POSTGRES_PASSWORD: climate123
      POSTGRES_DB: climate_dw
    ports: 
      - "5432:5432" #default postgres port
    volumes:
      - postgres_data:/var/lib/postgresql/data #maps our database to docker default vol so that data persists during restart.
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql #runs the schema sql file on the first run of the container to create the database schema.
  pgadmin: 
    image: dpage/pgadmin4:latest
    container_name: climate_pgadmin
    restart: unless-stopped
    environment: 
      PGADMIN_DEFAULT_EMAIL: admin@climate.dev
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80" # default pgadmin port
    depends_on:
      - postgres
volumes:
  postgres_data: